<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matemática pra Todos</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/css/site.css">
    <script src="/static/js/site-ui.js" defer></script>
</head>

<body class="internal-page">
    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-brand" href="/" aria-label="Matemática pra Todos — início">
                <span class="site-brand__symbol" aria-hidden="true">Σ</span>
                <span>Matemática <span class="site-brand__sub">pra Todos</span></span>
            </a>
            <nav class="site-nav" id="site-navigation" aria-label="Navegação principal">
                <a href="/">Início</a>
                <a href="/menu#atividades">Atividades</a>
                <a href="/menu#jogos">Jogos</a>
            </nav>
            <a class="site-enter" href="/menu" aria-label="Entrar nas atividades">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 3h5v18h-5M3 12h12M10 7l5 5-5 5"/></svg>
                <span>Entrar</span>
            </a>
            <button class="site-toggle" type="button" aria-controls="site-navigation" aria-expanded="false" aria-label="Abrir menu de navegação" hidden>
                <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
        </div>
    </header>


<header class="page-heading">
    <h1>Função do 2º Grau</h1>
    <p>Explore funções, gráficos e cálculos matemáticos.</p>
</header>

<main>

    <section class="card">

        <h2>Função Quadrática</h2>

        <p class="formula">
            f(x) = ax² + bx + c
        </p>

        <div class="campos">

            <label>
                a
                <input type="number" id="a" value="1" step="any">
            </label>

            <label>
                b
                <input type="number" id="b" value="-4" step="any">
            </label>

            <label>
                c
                <input type="number" id="c" value="3" step="any">
            </label>

        </div>

        <div class="campos">

            <label>
                X inicial
                <input type="number" id="xmin" value="-10">
            </label>

            <label>
                X final
                <input type="number" id="xmax" value="10">
            </label>

        </div>

        <button onclick="calcular()">
            Gerar gráfico
        </button>

    </section>


    <section class="card resultados">

        <h2>Resultados</h2>

        <div id="equacao"></div>
        <div id="delta"></div>
        <div id="raizes"></div>
        <div id="vertice"></div>
        <div id="concavidade"></div>

    </section>


    <section class="card grafico">

        <h2>Gráfico</h2>

        <canvas id="grafico"></canvas>

    </section>


    <section class="card">

        <h2>Tabela de valores</h2>

        <table>

            <thead>
                <tr>
                    <th>x</th>
                    <th>f(x)</th>
                </tr>
            </thead>

            <tbody id="tabelaValores"></tbody>

        </table>

    </section>

    <nav class="page-navigation" aria-label="Navegação ao final da página">
        <a class="page-navigation__back" href="/menu">← Voltar ao menu</a>
    </nav>

</main>

<footer>
    Matemática pra Todos
</footer>

<script src="js/app.js"></script>

</body>
</html>
